[project]
name = "player-churn-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek", email = "bisu.abhishek85@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "evidently>=0.7.21",
    "fastapi>=0.139.0",
    "joblib>=1.5.3",
    "mlflow>=3.14.0",
    "pandas>=2.3.3",
    "prometheus-client>=0.25.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[project.scripts]
player-churn-model = "player_churn_model:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F811", "F401", "E402"]
